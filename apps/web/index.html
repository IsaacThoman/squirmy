<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Squirmy</title>
    <script>
      try {
        const theme = JSON.parse(localStorage.getItem('squirmy.appearance') || '{}')
        if (typeof theme?.theme === 'string') document.documentElement.dataset.theme = theme.theme
        if (theme?.mode === 'light' || theme?.mode === 'dark') document.documentElement.dataset.colorMode = theme.mode
      } catch {
        // The default follows the browser's color scheme.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
