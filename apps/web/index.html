<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- The browser's own bars take the page's color; public/appearance.js and src/lib/appearance.ts set it. -->
    <meta name="theme-color" content="#fbf9ff" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Squirmy</title>
    <!--
      Before the app, and blocking: it applies the saved appearance so a reload never flashes the
      wrong colors. A file rather than inline, so the Content-Security-Policy allows scripts from
      this server only.
    -->
    <script src="/appearance.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
