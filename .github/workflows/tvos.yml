name: Apple TV

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/client-core/**'
      - 'packages/contracts/**'
      - 'patches/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tvos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile tvOS
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      EXPO_TV: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies and build shared packages
        run: |
          npm ci
          npm run build:packages

      - name: Generate the native tvOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Compile and bundle the app
        working-directory: apps/mobile
        run: |
          xcodebuild \
            -workspace ios/Squirmy.xcworkspace \
            -scheme Squirmy \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
