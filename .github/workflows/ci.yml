name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a release in progress on main; do cancel superseded PR runs.
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.event.pull_request.number) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: npm run lint
          - name: Typecheck
            command: npm run typecheck
          - name: Build
            command: npm run build
          # VitePress fails on links to missing pages; docs:check catches missing #anchors.
          - name: Docs
            command: npm run docs:build && npm run docs:check
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  test:
    name: Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: squirmy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SQUIRMY_TEST_DATABASE_URL: postgres://postgres:squirmy@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install audio tools
        run: bash .github/scripts/setup-audio-tools.sh

      - name: Install dependencies
        run: npm clean-install

      - name: Test
        run: npm test

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: squirmy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start it with a database and wait for /ready
        run: |
          docker network create squirmy-ci
          docker run -d --name postgres --network squirmy-ci -e POSTGRES_PASSWORD=squirmy -e POSTGRES_USER=squirmy -e POSTGRES_DB=squirmy postgres:17
          for attempt in $(seq 1 30); do docker exec postgres pg_isready -U squirmy -d squirmy && break; sleep 1; done
          docker run -d --name squirmy --network squirmy-ci -p 4747:4747 -e DATABASE_URL=postgres://squirmy:squirmy@postgres:5432/squirmy squirmy:ci
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4747/ready; then exit 0; fi
            sleep 1
          done
          docker logs squirmy
          exit 1

      - name: Check the bundled tools and the web app
        run: |
          docker exec squirmy ffmpeg -version | head -1
          docker exec squirmy fpcalc -version
          # Built without SQUIRMY_VERSION, SOURCE_COMMIT and git, the image reports "dev".
          curl --silent --fail http://127.0.0.1:4747/api/v1/setup/status | tee /dev/stderr | grep -q '"version":"dev"'
          curl --silent --fail http://127.0.0.1:4747/ | grep -qi "<!doctype html"

      - name: Wait for the health check
        run: |
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' squirmy)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 1
          done
          echo "Health status: $status"
          docker inspect --format '{{json .State.Health}}' squirmy
          exit 1

      # A source build such as Coolify's passes the commit it was built from.
      - name: Build the image with the source commit
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: squirmy:ci-commit
          build-args: SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha

      - name: Check that it reports the commit
        run: |
          docker rm -f squirmy
          docker run -d --name squirmy --network squirmy-ci -p 4747:4747 -e DATABASE_URL=postgres://squirmy:squirmy@postgres:5432/squirmy squirmy:ci-commit
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4747/ready; then break; fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:4747/api/v1/setup/status | tee /dev/stderr | grep -q "\"version\":\"dev+${GITHUB_SHA::7}\""

  # Coolify deploys every push to main without waiting for this workflow, so a red main is
  # already running on the test environment. Say so where the owner gets notified.
  deployed-red:
    name: Report a failing main
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, test, image]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "CI failed on main at ${GITHUB_SHA::7}, which the test environment already runs" \
            --body "CI failed for ${GITHUB_SHA} on main: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Coolify deploys main on push, so this commit is live on the test environment. Fix it on dev and promote again, or revert the merge on main (see the Git section of docs/architecture.md)."

  release:
    name: Semantic release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, test, image]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The commit this run tested. If main has moved on meanwhile, semantic-release sees
          # the local commit is behind and publishes nothing; the newer push's run releases
          # once its own checks pass.
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies
        run: npm clean-install

      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release

  publish:
    name: Publish image
    if: needs.release.outputs.version != ''
    needs: [release, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up QEMU for the arm64 build
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: SQUIRMY_VERSION=${{ needs.release.outputs.version }}
          # Links the package page to the repository and states what the image is.
          labels: |
            org.opencontainers.image.source=https://github.com/IsaacThoman/squirmy
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          tags: |
            ghcr.io/isaacthoman/squirmy:${{ needs.release.outputs.version }}
            ghcr.io/isaacthoman/squirmy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  testflight:
    name: Build and submit iOS to TestFlight
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.outputs.version != ''
    needs: release
    runs-on: xcode-27
    timeout-minutes: 60
    environment: testflight
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Install dependencies and build shared packages
        run: |
          npm clean-install
          npm run build:packages

      - name: Set iOS version
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release version in major.minor.patch format." >&2
            exit 1
          fi
          {
            echo "SQUIRMY_IOS_VERSION=$RELEASE_VERSION"
            echo "SQUIRMY_IOS_BUILD_NUMBER=$(date -u +%s)"
          } >> "$GITHUB_ENV"

      - name: Generate the native iOS project
        working-directory: apps/mobile
        env:
          SQUIRMY_IOS_CARPLAY: ${{ vars.SQUIRMY_IOS_CARPLAY }}
        run: npx expo prebuild --platform ios --clean

      # Keep signing credentials out of npm, Expo prebuild and CocoaPods.
      - name: Archive and upload to TestFlight
        working-directory: apps/mobile
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          IOS_DEVELOPMENT_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_P12_BASE64 }}
          IOS_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: bash scripts/upload-testflight.sh
