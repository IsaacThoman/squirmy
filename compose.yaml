# Squirmy with its database. Set MUSIC_DIR (in .env or the shell) and run `docker compose up -d`,
# which pulls the released image. In a clone of the repository, `docker compose up -d --build`
# builds the image from the source instead.
# Then open http://localhost:4747 and create the admin account. Guide: docs/server/quick-start.md
name: squirmy

services:
  app:
    image: ghcr.io/isaacthoman/squirmy:latest
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://squirmy:${POSTGRES_PASSWORD:-squirmy}@postgres:5432/squirmy
      # Added as a read-only library folder at start unless it already is one. Make it managed,
      # or add more folders, in Admin → Library.
      SQUIRMY_LIBRARY_PATHS: /music
      # To have Squirmy organize the folder and file uploads into it from the start, add it as
      # a managed folder instead (the volume must be writable): remove the line above and use
      # SQUIRMY_MANAGED_LIBRARY_PATHS: /music
      # Set to true when a reverse proxy sits in front and sends X-Forwarded-* headers.
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      # Use long syntax so Coolify honors the MUSIC_DIR override. Set read_only: true
      # to protect an existing collection at the filesystem level.
      - type: bind
        source: ${MUSIC_DIR:-./music}
        target: /music
        bind:
          create_host_path: true
      # Artwork, transcodes, uploads in progress and the generated secret.key. Transcodes and
      # resized art are rebuilt, and most of assets/ too; secret.key is not: back it up, with
      # assets/ (docs/server/backup.md).
      - squirmy_data:/data
    expose:
      - "4747"
    ports:
      - "${SQUIRMY_PORT:-4747}:4747"
    # Healthy once migrations have run and the database answers (/ready), as in the image, so
    # `docker compose ps` and Coolify show a build that cannot start as unhealthy.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 4747) + '/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 4

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: squirmy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-squirmy}
      POSTGRES_DB: squirmy
    volumes:
      - squirmy_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squirmy -d squirmy"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  squirmy_data:
  squirmy_db:
